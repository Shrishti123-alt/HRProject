<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>

.outer-div{
height:600px;
width:1000px;
border:none;
display:flex;
margin:auto;
margin-top:30px;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.2);

}
.d1{

height:600px;
width:400px;

}
.d2{
height:600px;
width:500px;

}

.image-div{
height:400px;

background-image:url(ofi.jpeg);
background-size:cover;
background-position:center;

}

.Info-div{
height:180px;
background-color:orange;
}

hr{
height:4px;
width:90px;
background-color:blue;
border-radius:18px;
margin-left:40px;
}

.form-box{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding: 30px 50px;
}

.input-box{
display:flex;
flex-direction:column;

}

.input-box label{
margin-bottom:8px;
font-weight:500;
font-family:'Poppins',sans-serif;
}

.input-box input{
 padding:12px;
 border:1px solid #ddd;
 border-radius:8px;
 outline:none;

}

.input-box input:focus{
border:1px solid orange;

}

.check-box{
margin-top:20px;
grid-column:1/3;
display:flex;
align-items:flex-start;
gap:8px;
font-family:'Poppins',sans-serif;
font-size:14px;
}

.check-box input{
width:16px;
height:16px;
}

.check-box label{
width:100%;
}

.highlight a{
color:orange;
font-weight:bold;
text-decoration:none;

}

.btn{
width:480px;
height:40px;
background-color:orange;
color:white;
margin-left:20px;
grid-column:1/3;
}

.btn:hover{
background-color:#FFAE6E;
}
</style>
</head>
<body>
<div class="outer-div">
<div class="d1">
<div class="image-div"></div>
<div class="Info-div">
<h1 style="color:white; font-family:'lora',sans-serif; font-weight:bold; margin-left:40px;">HR Registration</h1>
<hr>
<p style="color:white; font-family:'Poppins',sans-serif;  margin-left:30px; margin-right:30px;">Create an account to manage employees, attendance, payrolland much more in easier way</p>
</div>

</div>
<div class="d2">
<h2 style="margin-left:80px; font-family:'lora',sans-serif; font-weight:bold; margin-top:30px; ">Create HR Account</h2>
<form action="register" method="post" class=form-box>
<div class="input-box" >
<label>Full Name</label>
<input type="text" placeholder="Enter Full Name" name="name" required>
</div>
<div class="input-box">
<label>Email Address</label>
<input type="email" placeholder="Enter Email Address" name="email" required>
</div>
<div class="input-box">
<label>Mobile Number</label>
<input type="text" placeholder="Enter Mobile Number" name="mobile" required>
</div>
<div class="input-box">
<label>Date of Birth</label>
<input type="date" name="dob">
</div>
<div class="input-box">
<label>Password</label>
<input type="password" placeholder="Enter Password" name="pass">
</div>
<div class="input-box">
<label> Confirm Password</label>
<input type="password" placeholder="Confirm Password">
</div>
<div class="check-box">
<input type="checkbox" id="agree" required>
<label for="agree">I agree to the <span class="highlight">Terms & Conditions</span> and<span class="highlight"> Privacy Policy</span></label>
</div>

<button class="btn" type="submit">Create Account</button>


</form>
<p style="margin-left:200px;">Already have an account? <span class="highlight" ><a href="Login.html">Login</a></span></p>

</div>
</div>














</body>
</html>
